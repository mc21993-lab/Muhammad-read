<style>
[data-theme=dark]{--bg:#0a0a0d;--pg:#17171c;--tx:#e9e6df;--ac:#d4a95a;--mu:#8b8b94}
[data-theme=ink]{--bg:#050a18;--pg:#101a34;--tx:#e3ebff;--ac:#6ea8ff;--mu:#7f8db0}
[data-theme=forest]{--bg:#060f0a;--pg:#11231a;--tx:#e2f1e6;--ac:#7bd389;--mu:#7d9a86}
[data-theme=plum]{--bg:#110913;--pg:#241429;--tx:#f3e6f6;--ac:#d98cf0;--mu:#a088a8}
[data-theme=paper]{--bg:#c9c3b6;--pg:#fbf8f1;--tx:#1d1b18;--ac:#8a5a2b;--mu:#6d675c}
[data-theme=sepia]{--bg:#241c13;--pg:#f0e1c4;--tx:#3a2b19;--ac:#a0522d;--mu:#7a6548}
[data-theme=neon]{--bg:#000;--pg:#000;--mu:#6f6f78}
body.neon .hd span:first-child{text-shadow:0 0 calc(var(--gl)*.05px) var(--tx),0 0 calc(var(--gl)*.17px) var(--tx)}
.bd{position:relative;z-index:1;font-weight:var(--fw,400);text-shadow:0 0 calc(var(--gl,0)*.05px) var(--tx),0 0 calc(var(--gl,0)*.17px) var(--tx),0 0 calc(var(--em,0)*.025px) var(--edge,#0000),0 calc(var(--em,0)*.015px) calc(var(--em,0)*.035px) var(--edge,#0000),0 0 calc(var(--em,0)*.1px) var(--halo,#0000)}
.hd{position:relative;z-index:1}.hd span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%;direction:ltr}
.pb{position:absolute;inset:0;border-radius:inherit;background-size:cover;background-position:center;opacity:var(--po,.18);pointer-events:none;display:none}
body.pbg .pb{display:block}
.swb{width:36px;height:36px;border-radius:9px;padding:0;font-size:11px;border:2px solid #fff5}
input.hue,input.lit,input.sat{-webkit-appearance:none;appearance:none;flex:1;min-width:70px;height:14px;border-radius:7px;border:0;padding:0}
input.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
input.lit{background:linear-gradient(90deg,#000,#888,#fff)}
input.sat{background:linear-gradient(90deg,#888,#f33)}
input.hue::-webkit-slider-thumb,input.lit::-webkit-slider-thumb,input.sat::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #0008}
body.neon .pg{border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);box-shadow:0 0 calc(var(--gl)*.35px) color-mix(in srgb,var(--ac) 30%,transparent),0 24px 70px #000a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:none}
button,select,input,textarea{font:inherit;color:inherit;background:#ffffff14;border:1px solid #ffffff22;border-radius:9px;padding:7px 10px}
button{cursor:pointer}button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bar,#foot{display:flex;gap:6px;align-items:center;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#0006;backdrop-filter:blur(10px);z-index:300;flex-wrap:wrap}
#foot{padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.lg{font:700 22px Amiri,serif;color:var(--ac);margin-inline-end:auto}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none}
.pg{position:absolute;left:50%;top:50%;width:min(94vw,680px);height:min(88%,1000px);background-color:var(--pg);background-image:var(--pt,none);background-size:var(--ps,auto);color:var(--tx);border-radius:16px;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;box-shadow:0 24px 70px #000a;will-change:transform}
.pg.cur{user-select:text;-webkit-user-select:text}
.hd{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;border-bottom:1px solid #8883;padding-bottom:6px;margin-bottom:10px}
.bd{flex:1;overflow:hidden;font-family:var(--ff),'Noto Naskh Arabic',serif;line-height:var(--lh);text-align:justify;direction:rtl}
.bd p{margin:0 0 .75em}.bd .o{direction:ltr;text-align:left;font-family:Georgia,serif;white-space:pre-wrap}
.t{direction:ltr;unicode-bidi:isolate;font:.88em Georgia,serif;color:var(--ac)}
mark{--hc:#e5b83c;color:inherit;border-radius:3px;cursor:pointer}mark.h,mark:not(.u){background:color-mix(in srgb,var(--hc) 45%,transparent)}mark.u{background:none;text-decoration:underline;text-decoration-color:var(--hc);text-decoration-thickness:2.5px;text-underline-offset:6px}mark[data-n]::after{content:"✎";font-size:.7em;color:var(--hc);margin-inline-start:2px}
.st{overflow-wrap:anywhere;max-width:100%;margin:auto;text-align:center;color:var(--mu);font-family:system-ui;font-size:15px}
.sp{display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid #8884;border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation:none}}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;padding:30px;z-index:5}
#empty h1{font:700 64px Amiri,serif;margin:0;color:var(--ac)}#empty p{color:var(--mu);margin:0;max-width:30ch}
#sel{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:400;background:#000d;padding:6px;border-radius:12px}
#sel[hidden],#xf[hidden]{display:none}
#xf{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline-start:10px;z-index:500;opacity:.45}
body.fs #bar,body.fs #foot{display:none}
body.fs .pg{height:calc(100% - 16px);width:min(98vw,calc((100dvh - 16px)*9/16))}
#rg{flex:1;min-width:90px;direction:ltr;padding:0}
dialog{background:var(--pg);color:var(--tx);border:1px solid #fff2;border-radius:16px;width:min(94vw,520px);max-height:88dvh;padding:16px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
dialog input:not([type=range]),dialog select,dialog textarea{width:100%}
.res{display:block;width:100%;text-align:start;margin:4px 0}
dialog input.cp{width:50px;height:34px;padding:2px}
canvas{width:100%;border-radius:10px;background:#000}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#sel input{width:40px;height:34px;padding:2px}
.pg.fr .pb{display:block;opacity:1!important;background-size:contain;background-repeat:no-repeat}.pg.fr .bd{background:color-mix(in srgb,var(--pg) 84%,transparent);border-radius:12px;padding:10px;margin-top:auto;flex:0 1 58%}
.fo{font-size:.62em;color:var(--mu);border-bottom:1px dashed #8886;padding-bottom:.6em;margin-bottom:.8em;max-height:34%;overflow:hidden}

#dt{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(92vw,360px);background:var(--pg);color:var(--tx);border-inline-end:1px solid #fff2;z-index:600;padding:max(12px,env(safe-area-inset-top)) 14px 24px;overflow-y:auto;transform:translateX(105%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:0 0 40px #000a}
#dt.open{transform:none;visibility:visible}
#dt label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
#dt input:not([type=range]):not([type=checkbox]):not(.cp),#dt select{width:100%}
#dt input.cp{width:50px;height:34px;padding:2px}
#tb.on{background:var(--ac);color:#000;border-color:var(--ac)}
#pj{width:64px;padding:7px 4px;text-align:center}
.fa{position:fixed;inset-inline-end:6px;width:42px;height:42px;border-radius:50%;z-index:350;opacity:.5;display:none;padding:0;font-size:16px;background:#000a}.fa:hover{opacity:1}
#fu{top:calc(50% - 48px)}#fd{top:calc(50% + 6px)}
body[data-view=tablet] .fa,body[data-view=laptop] .fa{display:block}
body[data-view=tablet] .pg{width:calc(100% - 16px);height:calc(100% - 12px);border-radius:14px;padding:26px 56px}
body[data-view=laptop] .pg{width:min(94%,1000px);height:calc(100% - 20px);padding:30px 56px}
body[data-view=tablet].fs .pg{width:calc(100% - 8px);height:calc(100% - 8px)}
body[data-view=laptop].fs .pg{width:min(96%,1100px);height:calc(100% - 8px)}
body[data-view=tablet] .hd,body[data-view=laptop] .hd{font-size:14px}
body.turbo .pg{box-shadow:none!important;background-image:none;transition:none}
body.turbo .bd,body.turbo .hd span:first-child{text-shadow:none!important}
body.turbo #bar,body.turbo #foot{backdrop-filter:none;background:#000b}
</style></head>
<body data-theme="dark">

<script>
const $=s=>document.querySelector(s),E=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S=Object.assign({url:'http://localhost:11434/v1',model:'',key:'',theme:'dark',fs:21,font:'Amiri',lh:1.9,domain:'عام',pre:10,ns:100,ng:60,fit:true,fw:400,em:35,cp:'',ct:'',ca:'',tx:0,pb:0,po:18,fm:3,view:'auto',turbo:1},JSON.parse(localStorage.getItem('mh')||'{}'));
const sv=()=>localStorage.setItem('mh',JSON.stringify(S));
const TH={dark:['#17171c','#e9e6df','#d4a95a'],ink:['#101a34','#e3ebff','#6ea8ff'],forest:['#11231a','#e2f1e6','#7bd389'],plum:['#241429','#f3e6f6','#d98cf0'],paper:['#fbf8f1','#1d1b18','#8a5a2b'],sepia:['#f0e1c4','#3a2b19','#a0522d']};
const TN={dark:'داكن',ink:'حبر',forest:'غابة',plum:'عنبي',paper:'ورقي',sepia:'دافئ'};
const NH={cyan:[185,'نيون سماوي'],magenta:[315,'نيون وردي'],lime:[100,'نيون ليموني'],amber:[35,'نيون كهرماني'],violet:[268,'نيون بنفسجي'],white:[0,'نيون أبيض على أسود']};
const nL=sa=>62+(100-sa)*.38;
const neonCol=k=>k==='white'?'#ffffff':`hsl(${NH[k][0]},${S.ns}%,${nL(S.ns)}%)`;
for(const k in NH){TH['n-'+k]=['#000000','#fff','#fff'];TN['n-'+k]=NH[k][1]}
for(const k in TH){for(const s of['#th','#qt']){const o=E('option');o.value=k;o.textContent=TN[k];$(s).append(o)}}
const kvp=new Promise(r=>{const q=indexedDB.open('muhammad',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const kv={async get(k){try{const d=await kvp;return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}},async set(k,v){try{const d=await kvp;d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch{}}};
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const FONTS=[['Amiri','نسخ كلاسيكي مريح'],['Noto Naskh Arabic','نسخ واضح'],['Cairo','عصري بسيط'],['Scheherazade New','نسخ تقليدي كبير'],['Tajawal','خفيف وواضح'],['Almarai','بسيط للقراءة الطويلة'],['IBM Plex Sans Arabic','حديث متوازن'],['Lateef','نسخ ناعم بخط اليد'],['Harmattan','نسخ مريح للعين'],['Markazi Text','نسخ للكتب'],['Aref Ruqaa','رقعة'],['Reem Kufi','كوفي'],['El Messiri','عصري بلمسة عربية'],['Mada','سهل وواضح'],['Readex Pro','حديث واضح للقراءة'],['Alexandria','بسيط ومفتوح'],['Vazirmatn','نظيف وسهل'],['Noto Kufi Arabic','كوفي مقروء'],['Noto Sans Arabic','نسخ بسيط'],['Changa','عصري دافئ'],['Mirza','نسخ بخط اليد'],['Katibeh','خط كاتب أصيل'],['Playpen Sans Arabic','كتابة يد سهلة'],['Baloo Bhaijaan 2','ودود مستدير']];

  B.tr[p]=o;fill(p);persist();status();return}
  const pv=B.tr[p-1]?B.tr[p-1].slice(-300):'',nx=p+1<B.n?(await getText(p+1)).slice(0,300):'';
 const u=`[سياق للاطلاع فقط — لا تترجمه ولا تكرره في ردك]\n${pv?'نهاية الصفحة السابقة (مترجمة): '+pv+'\n':''}${nx?'بداية الصفحة التالية (بلغتها الأصلية): '+nx+'\n':''}${B.notes[p]?'ملاحظة المستخدم: '+B.notes[p]+'\n':''}\n[النص المطلوب ترجمته فقط]\n${t}`;
 const out=await chat([{role:'system',content:sys(t,p)},{role:'user',content:u}],sig);
 if(!out)throw new Error('رد فارغ من النموذج');
